name: Build Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - name: Ensure platforms exist
        run: |
          if (!(Test-Path windows/CMakeLists.txt)) {
            flutter create --platforms windows --project-name unipilot --org com.unipilot .
          }
        shell: pwsh
      - run: flutter --version
      - run: flutter doctor -v
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        shell: bash
      - run: flutter test --coverage
        shell: bash
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: unipilot-windows
          path: build/windows/x64/runner/Release/
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath unipilot-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: unipilot-windows.zip
          generate_release_notes: true
