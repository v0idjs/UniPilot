name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Ensure platforms exist
        run: |
          if [ ! -f android/build.gradle ] || [ ! -f windows/CMakeLists.txt ]; then
            flutter create --platforms android,windows --project-name unipilot --org com.unipilot . || true
          fi
        shell: bash
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage
      - run: dart tool/coverage_gate.dart
