name: Release UniPilot

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Ensure platforms exist
        run: |
          # Scaffold both runners: the icon step generates android and
          # windows outputs and fails when either tree is missing.
          # Flutter 3.47 scaffolds Kotlin DSL (settings.gradle.kts);
          # older Flutter used Groovy (settings.gradle) — accept either.
          if { [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; } || [ ! -f windows/CMakeLists.txt ]; then
            flutter create --platforms android,windows --project-name unipilot --org com.unipilot . || true
          fi
        shell: bash

      - name: Install Android SDK 35 & Build-Tools 35.0.0
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            SDK_MGR="sdkmanager"
          elif [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MGR="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          else
            SDK_MGR=$(find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          echo "Using sdkmanager at: $SDK_MGR"
          ANDROID_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # Force reinstall: remove corrupted platform if present
          echo "Removing potentially corrupted android-35 platform..."
          rm -rf "$ANDROID_DIR/platforms/android-35" || true
          rm -rf "/usr/local/lib/android/sdk/platforms/android-35" || true
          yes | "$SDK_MGR" --licenses 2>&1 | tail -5 || true
          "$SDK_MGR" --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" 2>&1 | tail -30 || true
          ls -lh "$ANDROID_DIR/platforms/android-35/android.jar" || true
          ls -lh "/usr/local/lib/android/sdk/platforms/android-35/android.jar" || true
          ndk_path="$ANDROID_DIR/ndk/26.1.10909125/source.properties"
          if [ -f "$ndk_path" ]; then echo "NDK 26 installed"; cat "$ndk_path" | head -5; else echo "NDK 26 missing, will try alternative install"; fi
          # Verify jar is not corrupted
          if [ -f "$ANDROID_DIR/platforms/android-35/android.jar" ]; then
            unzip -l "$ANDROID_DIR/platforms/android-35/android.jar" | head -5 || echo "WARNING: android.jar verification failed"
          fi
        shell: bash

      - name: Patch Android for SDK 35, Build-Tools 35.0.0, and Kotlin 1.9.22
        run: |
          echo "=== BEFORE ==="
          cat android/settings.gradle 2>/dev/null | head -30 || true
          cat android/settings.gradle.kts 2>/dev/null | head -30 || true
          cat android/app/build.gradle 2>/dev/null | head -40 || true
          cat android/app/build.gradle.kts 2>/dev/null | head -60 || true
          if [ -f android/app/build.gradle.kts ]; then
            echo "=== Kotlin DSL layout (Flutter 3.32+ template): skipping legacy version pins (template is already modern) ==="
            # Enable core library desugaring for flutter_local_notifications
            if ! grep -q "isCoreLibraryDesugaringEnabled\|coreLibraryDesugaring" android/app/build.gradle.kts; then
              printf '\nandroid {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n}\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
              echo "=== Desugaring dependency added (Kotlin DSL) ==="
            fi
            grep -n "desugar\|compileSdk\|targetSdk" android/app/build.gradle.kts | head -20 || true
            echo "=== AFTER (Kotlin DSL, version pins skipped) ==="
            exit 0
          fi
          echo "=== Groovy layout: applying legacy pins ==="
          sed -i -E 's/org\.jetbrains\.kotlin\.android" version "[^"]+"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true
          # Bump AGP from 7.3.0 to 8.5.0 for SDK 35 support
          sed -i -E 's/com\.android\.application" version "[^"]+"/com.android.application" version "8.5.0"/' android/settings.gradle || true
          sed -i -E 's/com\.android\.library" version "[^"]+"/com.android.library" version "8.5.0"/' android/settings.gradle || true
          sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i -E 's/ext\.kotlin_version = "[^"]+"/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
          # Patch compileSdk - handle both 'compileSdk flutter.X' and 'compileSdk = flutter.X'
          if grep -q "compileSdk = flutter.compileSdkVersion" android/app/build.gradle; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk 35/' android/app/build.gradle || true
            # Add buildToolsVersion after compileSdk line if not present
            if ! grep -q "buildToolsVersion" android/app/build.gradle; then
              sed -i '/compileSdk 35/a \        buildToolsVersion = "35.0.0"' android/app/build.gradle || true
            fi
          elif grep -q "compileSdk flutter.compileSdkVersion" android/app/build.gradle; then
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/' android/app/build.gradle || true
            if ! grep -q "buildToolsVersion" android/app/build.gradle; then
              sed -i '/compileSdk 35/a \        buildToolsVersion "35.0.0"' android/app/build.gradle || true
            fi
          fi
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk 35/' android/app/build.gradle || true
          sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 35/' android/app/build.gradle || true
          # Fix NDK version for plugins requiring 26.1.10909125
          if grep -q "ndkVersion = flutter.ndkVersion" android/app/build.gradle; then
            sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "26.1.10909125"/' android/app/build.gradle || true
          elif grep -q "ndkVersion flutter.ndkVersion" android/app/build.gradle; then
            sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion = "26.1.10909125"/' android/app/build.gradle || true
          fi
          # Enable core library desugaring for flutter_local_notifications
          if ! grep -q "coreLibraryDesugaringEnabled" android/app/build.gradle; then
            sed -i '/compileOptions/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle || true
          fi
          if ! grep -q "desugar_jdk_libs" android/app/build.gradle; then
            # Append desugaring dependency at end of file (top-level) - Groovy syntax
            printf '\ndependencies {\n    coreLibraryDesugaring '\''com.android.tools:desugar_jdk_libs:2.1.4'\''\n}\n' >> android/app/build.gradle || true
            echo "=== Desugaring dependency added ==="
          fi
          cat android/app/build.gradle | tail -30
          grep -n "coreLibraryDesugaring\|desugar" android/app/build.gradle || true
          # Bump Gradle wrapper to 8.7 for AGP 8.5
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i -E 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' android/gradle/wrapper/gradle-wrapper.properties || true
            cat android/gradle/wrapper/gradle-wrapper.properties || true
          fi
          echo "=== AFTER ==="
          cat android/app/build.gradle 2>/dev/null | head -50 || true
          grep -n "kotlin\|compileSdk\|buildToolsVersion\|targetSdk" android/settings.gradle android/build.gradle android/app/build.gradle android/settings.gradle.kts android/app/build.gradle.kts 2>/dev/null || true
        shell: bash

      - name: Configure persistent signing key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Signing secrets present - configuring persistent release key."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            # The Flutter template picks up android/key.properties automatically,
            # so every release is signed with the same key and updates install cleanly.
          else
            echo "WARNING: no signing secrets - falling back to debug signing."
            echo "Debug keys differ per CI machine, so updates may conflict;"
            echo "see docs/release.md for the persistent-key setup."
          fi
        shell: bash

      - name: Require signing secrets for releases
        run: |
          # A debug-signed APK carries an ephemeral CI key, so the NEXT
          # release would be rejected on users' phones ("package conflicts
          # with an existing package"). Never ship that from a tag;
          # manual dry-runs via workflow_dispatch only warn.
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "ERROR: refusing to build a release APK without signing secrets."
              echo "Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and"
              echo "KEY_PASSWORD (see docs/release.md) and re-tag."
              exit 1
            fi
            echo "WARNING: dry-run without signing secrets - APK would be debug-signed."
          else
            echo "Signing secrets present - release APK uses the persistent key."
          fi
        shell: bash

      - run: flutter pub get
      - name: Generate launcher icons
        run: |
          dart run flutter_launcher_icons
          echo "=== Verifying generated icons ==="
          ls android/app/src/main/res/mipmap-hdpi/launcher_icon.png \
             android/app/src/main/res/mipmap-mdpi/launcher_icon.png \
             android/app/src/main/res/mipmap-xhdpi/launcher_icon.png \
             android/app/src/main/res/mipmap-xxhdpi/launcher_icon.png \
             android/app/src/main/res/mipmap-xxxhdpi/launcher_icon.png
        shell: bash
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter test --coverage || true
      # Single universal APK: one file per release, no ABI picking, and the
      # versionCode from pubspec guarantees updates replace older installs.
      - run: flutter build apk --release

      - name: Stage APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/unipilot-android.apk
          ls -lh build/app/outputs/flutter-apk/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: unipilot-apk
          path: build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Build Windows Application
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop

      - name: Ensure platforms exist
        run: |
          # Scaffold both runners: the icon step generates android and
          # windows outputs and fails when either tree is missing.
          if (!(Test-Path android/settings.gradle) -or !(Test-Path windows/CMakeLists.txt)) {
            flutter create --platforms android,windows --project-name unipilot --org com.unipilot .
          }
        shell: pwsh

      - name: Brand the native window background
        run: |
          $runner = "windows/runner"
          Write-Output "=== Native background scan ==="
          Get-ChildItem $runner -Filter *.cpp | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'hbrBackground|CreateSolidBrush|COLOR_WINDOW|RGB\(' | ForEach-Object { Write-Output "$($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
          }
          # Best effort: swap a white brush for brand indigo (#1E1B4B) so the
          # window is never white before the first Flutter frame paints.
          $target = Join-Path $runner "win32_window.cpp"
          if (Test-Path $target) {
            $text = Get-Content $target -Raw
            $patched = $text -replace 'RGB\(\s*255\s*,\s*255\s*,\s*255\s*\)', 'RGB(30, 27, 75)'
            if ($patched -ne $text) {
              Set-Content $target $patched -NoNewline
              Write-Output "Patched white brush to brand indigo."
            } else {
              Write-Output "No white brush found - leaving runner untouched."
            }
          }
        shell: pwsh

      - name: Patch Windows runner for renderer fallback
        run: |
          # UniPilot #17: opt-in Skia fallback for GPUs/drivers where the
          # Impeller presentation path shows a blank window. Default stays
          # Impeller; UNIPILOT_RENDERER=software, a --software flag, or an
          # RDP session selects Skia. Fail loudly if the template anchor
          # moves so we never ship a silently unpatched runner.
          $target = Join-Path "windows/runner" "main.cpp"
          $anchor = 'project.set_dart_entrypoint_arguments(std::move(command_line_arguments));'
          $text = Get-Content $target -Raw
          if ($text -notmatch [regex]::Escape($anchor)) {
            Write-Error "main.cpp anchor moved - renderer fallback not applied."
            exit 1
          }
          if ($text -notmatch 'UNIPILOT_RENDERER') {
            # No here-strings: their terminator must sit at column 0,
            # which would end the YAML block scalar and break parsing.
            $fallbackLines = @(
              '// UniPilot renderer fallback (issue #17): honor UNIPILOT_RENDERER=software',
              '// or a --software flag, and auto-fallback on RDP sessions where the GPU',
              '// presentation path is unreliable. Falls back to Skia; the default stays',
              '// Impeller for everyone else. NOTE: this changes the renderer backend,',
              '// not full software rasterization -- this SDK''s embedder API exposes no',
              '// generic engine-switches knob, so --enable-software-rendering cannot be',
              '// passed through. See docs/windows-legacy-gpu.md.',
              '{',
              '  const std::wstring args(command_line != nullptr ? command_line : L"");',
              '  // Matches a standalone --software token only (space- or',
              '  // quote-delimited): the runner also forwards CLI args to Dart,',
              '  // so a substring check could misfire on a future Dart flag.',
              '  // ASCII codes below: 32 = space, 34 = double quote.',
              '  const auto hasSoftwareFlag = [](const std::wstring& cmd) {',
              '    const std::wstring flag = L"--software";',
              '    size_t pos = 0;',
              '    while ((pos = cmd.find(flag, pos)) != std::wstring::npos) {',
              '      const bool leftOk = (pos == 0) || (cmd[pos - 1] == 32 || cmd[pos - 1] == 34);',
              '      const size_t end = pos + flag.size();',
              '      const bool rightOk = (end >= cmd.size()) || (cmd[end] == 32 || cmd[end] == 34);',
              '      if (leftOk && rightOk) {',
              '        return true;',
              '      }',
              '      pos += flag.size();',
              '    }',
              '    return false;',
              '  };',
              '  bool software = hasSoftwareFlag(args);',
              '  wchar_t renderer_env[32] = {};',
              '  if (::GetEnvironmentVariableW(L"UNIPILOT_RENDERER", renderer_env, 32) >',
              '      0) {',
              '    software = software || (std::wstring(renderer_env) == L"software");',
              '  }',
              '  if (!software && ::GetSystemMetrics(SM_REMOTESESSION) != 0) {',
              '    software = true;',
              '  }',
              '  if (software) {',
              '    project.set_impeller_switch(flutter::ImpellerSwitch::Disabled);',
              '  }',
              '}'
            )
            $fallback = ($fallbackLines -join "`r`n")
            $text = $text -replace [regex]::Escape($anchor), ($anchor + "`r`n" + $fallback)
            Set-Content $target $text -NoNewline -Encoding utf8
            $check = Get-Content $target -Raw
            if ($check -notmatch 'set_impeller_switch\(flutter::ImpellerSwitch::Disabled\)') {
              Write-Error "patch write did not take - marker absent after write."
              exit 1
            }
            Write-Output "Renderer fallback patched into main.cpp."
          } else {
            Write-Output "Renderer fallback already present."
          }
        shell: pwsh

      - run: flutter pub get
      - name: Generate launcher icons
        run: |
          dart run flutter_launcher_icons
          echo "=== Verifying generated icons ==="
          ls windows/runner/resources/app_icon.ico
        shell: bash
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        shell: bash
      - run: flutter test --coverage
        shell: bash
      - run: flutter build windows --release

      - name: Add safe-mode launcher
        run: |
          # UniPilot #17: one-click fallback for blank-window machines.
          # Sets UNIPILOT_RENDERER=software (see the runner patch above),
          # then launches the app from its own folder. No machine-specific
          # paths: %~dp0 always resolves to the unzipped folder.
          $bat = "@echo off`r`nset UNIPILOT_RENDERER=software`r`nstart `"`" `"%~dp0unipilot.exe`" %*`r`n"
          Set-Content -Path "build\windows\x64\runner\Release\unipilot-safe-mode.bat" -Value $bat -NoNewline -Encoding Ascii
          Get-Content -Path "build\windows\x64\runner\Release\unipilot-safe-mode.bat"
        shell: pwsh

      - name: Zip Windows build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath unipilot-windows.zip
        shell: pwsh

      - name: Verify Windows artifact
        run: |
          # UniPilot #17: the zip must ship the safe-mode launcher, and the
          # runner source must carry the patched marker. Fail loudly here
          # rather than publishing a release without the fallback.
          $src = Get-Content windows/runner/main.cpp -Raw
          if ($src -notmatch 'set_impeller_switch\(flutter::ImpellerSwitch::Disabled\)') {
            Write-Error "patched runner marker absent in windows/runner/main.cpp."
            exit 1
          }
          Expand-Archive -Path unipilot-windows.zip -DestinationPath zipcheck -Force
          foreach ($f in @('unipilot.exe', 'unipilot-safe-mode.bat')) {
            if (!(Test-Path (Join-Path 'zipcheck' $f))) {
              Write-Error "missing $f in unipilot-windows.zip."
              exit 1
            }
          }
          $bat = Get-Content zipcheck/unipilot-safe-mode.bat -Raw
          if ($bat -notmatch 'UNIPILOT_RENDERER=software') {
            Write-Error "safe-mode launcher does not set UNIPILOT_RENDERER."
            exit 1
          }
          Write-Output "Windows artifact verification passed."
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: unipilot-windows
          path: unipilot-windows.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-apk, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: unipilot-apk
          path: release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: unipilot-windows
          path: release-assets/

      - name: Verify release assets
        run: |
          echo "=== Release Assets to Upload ==="
          ls -lh release-assets/
          count_apk=$(ls -1 release-assets/*.apk 2>/dev/null | wc -l)
          count_zip=$(ls -1 release-assets/*.zip 2>/dev/null | wc -l)
          if [ "$count_apk" -eq 0 ] || [ "$count_zip" -eq 0 ]; then
            echo "ERROR: Missing APK or Windows zip artifact!"
            exit 1
          fi
          echo "Verification passed: $count_apk APKs and $count_zip zip found."
        shell: bash

      - name: Extract changelog for this tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "Extracting changelog for $TAG"
          awk -v tag="$TAG" '
            $0 ~ "^## " tag {p=1; print; next}
            $0 ~ /^## v/ {if(p) exit}
            p' CHANGELOG.md > /tmp/changelog.txt
          cat /tmp/changelog.txt
          if [ ! -s /tmp/changelog.txt ]; then
            echo "No changelog entry for $TAG, using fallback"
            echo "### Changes in $TAG" > /tmp/changelog.txt
            git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "HEAD")..HEAD >> /tmp/changelog.txt || true
          fi
          # Prepare body with header + changelog + assets
          cat > /tmp/release_body.md << 'EOF'
          ### UniPilot ${{ github.ref_name }}

          **Offline-first Flutter app — schedule, deadlines, GPA, campus**

          EOF
          cat /tmp/changelog.txt >> /tmp/release_body.md
          cat >> /tmp/release_body.md << 'EOF'

          #### Release Assets
          - **Android APK**:
            - `unipilot-android.apk` (universal build for all devices)
          - **Windows Desktop**:
            - `unipilot-windows.zip` (standalone Windows release)

          #### Tech Stack
          - Flutter 3.47.5 · Drift · Riverpod · go_router · flutter_local_notifications
          EOF
          cat /tmp/release_body.md
        shell: bash

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: UniPilot ${{ github.ref_name }} — Offline-first Student Co-Pilot
          body_path: /tmp/release_body.md
          generate_release_notes: true
