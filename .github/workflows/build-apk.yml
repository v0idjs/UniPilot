name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Ensure platforms exist
        run: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --platforms android --project-name unipilot --org com.unipilot . || true
          fi
        shell: bash
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses 2>&1 | tail -5 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -20 || true
          ls -lh /usr/local/lib/android/sdk/platforms/android-35/android.jar || true
        shell: bash
      - name: Patch Android for SDK 35 + Kotlin 1.9.22
        run: |
          sed -i -E 's/org\.jetbrains\.kotlin\.android" version "[^"]+"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true
          sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i -E 's/ext\.kotlin_version = "[^"]+"/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk 35/' android/app/build.gradle || true
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk 35/' android/app/build.gradle || true
          sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 35/' android/app/build.gradle || true
          grep -n "kotlin\|compileSdk\|targetSdk" android/settings.gradle android/build.gradle android/app/build.gradle || true
        shell: bash
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter test --coverage || true
      - run: flutter build apk --release --split-per-abi
      - name: List APKs
        run: ls -lh build/app/outputs/flutter-apk/ || true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: unipilot-apk
          path: build/app/outputs/flutter-apk/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
