name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Ensure platforms exist
        run: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --platforms android --project-name unipilot --org com.unipilot . || true
          fi
          ls -la android/
        shell: bash
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" --verbose || true
          ls -lh /usr/local/lib/android/sdk/platforms/android-35/android.jar || true
        shell: bash
      - name: Patch Android for SDK 35 + Kotlin 1.9.22
        run: |
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo "=== android/app/build.gradle ==="
          cat android/app/build.gradle | head -60
          # Generic Kotlin bump: replace any quoted kotlin version with 1.9.22
          sed -i -E 's/org\.jetbrains\.kotlin\.android" version "[^"]+"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true
          sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          sed -i -E 's/ext\.kotlin_version = "[^"]+"/ext.kotlin_version = '\''1.9.22'\''/' android/build.gradle || true
          # Force compileSdk 35
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/compileSdk 34/compileSdk 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk 34/targetSdk 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 35/' android/app/build.gradle || true
          echo "=== PATCHED ==="
          grep -n "kotlin\|compileSdk\|targetSdk" android/settings.gradle android/build.gradle android/app/build.gradle || true
        shell: bash
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter test --coverage || true
      - run: flutter build apk --release --split-per-abi --verbose 2>&1 | tail -100
      - uses: actions/upload-artifact@v4
        with:
          name: unipilot-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
