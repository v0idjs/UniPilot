name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Ensure platforms exist
        run: |
          if [ ! -f android/build.gradle ] || [ ! -f windows/CMakeLists.txt ]; then
            flutter create --platforms android,windows --project-name unipilot --org com.unipilot . || true
          fi
        shell: bash
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - run: flutter test --coverage || true
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: unipilot-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
