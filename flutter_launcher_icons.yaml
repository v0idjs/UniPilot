# Icon source is the exact brand vector at assets/logo.svg.
# assets/icon/app_icon.png is a raster derived from that exact file
# (do not hand-edit the PNG). The launcher tool decodes raster images
# only, so every entry below must point at the PNG master, never the SVG.
# Only android and windows runners exist (both CI-generated); ios and
# web outputs are disabled until those runners ship.
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1E1B4B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
