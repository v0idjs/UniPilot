name: unipilot
description: UniPilot — Your Personal University Co-Pilot. Offline-first schedule, deadlines, GPA and campus helper.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.24
  drift_flutter: ^0.2.4
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.19.0
  uuid: ^4.5.1
  csv: ^6.0.0
  timezone: ^0.9.4
  flutter_local_notifications: ^17.1.2
  file_picker: ^9.2.1
  share_plus: ^10.1.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  riverpod_generator: ^2.6.4
  riverpod_lint: ^2.6.4
  custom_lint: ^0.7.0
  mockito: ^5.4.4
  fake_async: ^1.3.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/samples/
    - assets/campus/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
