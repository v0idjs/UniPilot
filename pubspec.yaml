name: unipilot
description: UniPilot — Your Personal University Co-Pilot. Offline-first schedule, deadlines, GPA and campus helper.
publish_to: 'none'
version: 0.6.2+26

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  uuid: ^4.5.1
  csv: ^8.0.0
  timezone: ^0.9.4
  flutter_local_notifications: ^17.1.2
  flutter_svg: ^2.0.10+1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/samples/
    - assets/campus/
